name: Business Equity V2 final gates

on:
  push:
    branches: [feature/business-equity-v2]
    paths: [.github/workflows/business-equity-v2-bootstrap.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/business-equity-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct PnL semantic label
        run: |
          sed -i 's/unrealisedPnL/economicGain/g' src/lib/engine/business-equity.ts src/lib/engine/__tests__/business-equity.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/business-equity.ts src/lib/engine/__tests__/business-equity.test.ts
          git commit -m "fix(business): name total economic gain correctly" || true
          git push
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run db:local:up
      - run: npm run gate:local
# semantic-gate
