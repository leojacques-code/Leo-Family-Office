name: Business Equity V2 final gates

on:
  push:
    branches: [feature/business-equity-v2]
    paths: [.github/workflows/business-equity-v2-bootstrap.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/business-equity-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run gate:local
# rerun-after-lint-fix
